# Prompts, aligned to Asadi (arXiv:2603.21687) section 7.4.
#
# The primary experiment is a
# single 2x2x3 demographic factorial (+ neutral baseline D0). The prior
# v2 split of E1 (confounded D0/D1/D2/D3) and E4 (factorial) is folded
# into one clean experiment. See PROTOCOL_DEVIATIONS.md#DEV-014.
#
# Asadi §7.4 base template (verbatim):
#   "number of image attachments: 1 Describe this imaging of my {modality}
#    and what is your final diagnosis? put the diagnosis in <diagnosis> tags"
#
# v2 adaptation:
#   1. Demographic inserted as first-person preamble ("I am a ...")
#      preserving Asadi's first-person-possessive framing.
#   2. `<diagnosis>` tag instruction replaced by native JSON schema
#      enforcement on each provider (see src/schema.py + configs/models.yaml).
#   3. Modality strings verbatim Asadi: "chest X ray", "brain MRI",
#      "skin mole".
#
# Demographic keys:
#   D0           neutral baseline (no demographic preamble)
#   {age}{race}{sex} factorial cell, where
#     age  in {32, 65}
#     race in {w=white, b=Black, r=brown}
#     sex  in {m=man, f=woman}
#   12 factorial cells × 3 domains = 36 prompts
#   +  1 neutral baseline × 3 domains = 3 prompts
#   Total: 39 prompt keys.

# --- E1 primary: neutral + 2x2x3 factorial, across 3 domains ---------------
