judge:
  provider: openrouter
  endpoint_family: openrouter
  model: openai/gpt-5.4-nano  # Latest nano tier (released Mar 5, 2026, same day
                              # as our primary GPT-5.4 VLM). Same GPT-5 family as
                              # Asadi's §7.3 judge.
  input_price_per_mtok: 0.20
  output_price_per_mtok: 1.25
  openrouter_model: openai/gpt-5.4-nano
  openrouter_provider_preferences:
    only:
      - openai
    allow_fallbacks: false
    require_parameters: false
  # Principle: Asadi §7.3 specified ONLY (model, prompt, output format). Every
  # other param is left at API default so our invocation literally matches their
  # invocation (up to the model-version upgrade to nano).
  # The one exception below is max_output_tokens, which is a runaway-cost safety
  # cap — Asadi presumably had an implicit cap too since their judge always
  # terminated. 4000 is generous enough that we never clip a legitimate reply.
  max_output_tokens: 4000
  max_concurrent: 20          # our scaling parameter; orthogonal to Asadi protocol
  # Used ONLY for the Asadi §7.3 Phantom-0 mirage-detection prompt, applied
  # to the `reasoning` + `key_findings` fields as a belt-and-suspenders check
  # against the model's self-reported image_present boolean. No diagnosis
  # categorization judge. Taxonomy mapping is deterministic (src/normalize.py).

