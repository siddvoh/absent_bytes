# Model configuration, aligned to Asadi (arXiv:2603.21687) section 7.1.
# Every value below is either a direct Asadi quote or a probe-validated
# equivalent. See docs/superpowers/specs/2026-04-18-json-protocol-redesign.md
# for the full derivation and probe evidence.
#
# Structured output is routed through OpenRouter for all primary models in the
# EMNLP controls. Provider pinning is explicit per model so calls use the
# configured direct-key endpoints where available.
#
# CoT capture (DEV-008):
#   anthropic: NONE. Forced tool_use disables thinking (API 400:
#              "Thinking may not be enabled when tool_choice forces tool use").
#              This provider constraint is logged explicitly.
#   openai:    reasoning.summary="auto" returns a reasoning summary we save.
#   gemini:    thinking_config.include_thoughts=true tags parts with thought=true.

anthropic:
  provider: openrouter
  endpoint_family: openrouter
  model: anthropic/claude-opus-4.7
  input_price_per_mtok: 5.00
  output_price_per_mtok: 25.00
  temperature: 1.0      # parity: configs/parity.yaml
  # Opus 4.7 ignores sampling temperature; keep parity value in request/audit.
  max_tokens: 4000      # parity max_output_tokens equivalent
  reasoning_effort: medium
  structured_output: json_schema_strict
  tool_name: record_diagnosis
  max_concurrent: 5
  openrouter_model: anthropic/claude-opus-4.7
  # Anthropic BYOK is configured in the OpenRouter workspace. The Anthropic
  # key must be in the Prioritized section with "Always use for this provider"
  # enabled to prevent shared-capacity fallback.
  openrouter_byok_required: true
  openrouter_byok_verification: openrouter_activity_provider_responses
  openrouter_provider_preferences:
    order:
      - anthropic
    only:
      - anthropic
    allow_fallbacks: false
    require_parameters: false

anthropic_direct:
  # Legacy key kept so older scripts do not break, but July 10 runs must not
  # call Anthropic directly. This alias routes through OpenRouter with the same
  # Anthropic BYOK requirement as the primary `anthropic` key.
  provider: openrouter
  endpoint_family: openrouter
  model: anthropic/claude-opus-4.7
  input_price_per_mtok: 5.00
  output_price_per_mtok: 25.00
  temperature: 1.0
  omit_temperature: true
  max_tokens: 4000
  reasoning_effort: medium
  structured_output: json_schema_strict
  structured_method: output_config
  anthropic_adaptive_thinking: true
  thinking_display: summarized
  max_concurrent: 2
  openrouter_model: anthropic/claude-opus-4.7
  openrouter_byok_required: true
  openrouter_byok_verification: openrouter_activity_provider_responses
  openrouter_provider_preferences:
    order:
      - anthropic
    only:
      - anthropic
    allow_fallbacks: false
    require_parameters: false

